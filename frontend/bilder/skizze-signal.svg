<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260">
<style>
    text { font-family: system-ui, sans-serif; font-size: 17px; fill: #000; }
    .fett { font-weight: bold; }
    .mitte { text-anchor: middle; }
    .klein { font-size: 14px; fill: #555; }
    .mono { font-family: monospace; font-size: 15px; }
    .geheim { fill: #3d5afe; font-weight: bold; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .box-blau { fill: #fff; stroke: #3d5afe; stroke-width: 3; }
    .box-grau { fill: #fff; stroke: #000; stroke-width: 2; stroke-dasharray: 6 4; }
    .linie { stroke: #000; stroke-width: 2; fill: none; }
    .pfeil { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#pfeil); }
    .pfeil-blau { stroke: #3d5afe; stroke-width: 2; fill: none; marker-end: url(#pfeil-blau); }
    .gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .pfeil-gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#pfeil); }
</style>
<defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
    <marker id="pfeil-blau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#3d5afe"/>
    </marker>
</defs>
<text x="10" y="22" class="fett">Kettenschlüssel werden nur vorwärts weitergedreht:</text>
<rect x="10" y="40" width="100" height="40" class="box"/>
<text x="60" y="66" class="mitte">Kette 1</text>
<rect x="260" y="40" width="100" height="40" class="box"/>
<text x="310" y="66" class="mitte">Kette 2</text>
<rect x="510" y="40" width="100" height="40" class="box"/>
<text x="560" y="66" class="mitte">Kette 3</text>
<line x1="110" y1="60" x2="153" y2="60" class="pfeil"/>
<rect x="155" y="42" width="60" height="36" class="box"/>
<text x="185" y="66" class="mitte fett">KDF</text>
<line x1="215" y1="60" x2="258" y2="60" class="pfeil"/>
<line x1="185" y1="78" x2="185" y2="128" class="pfeil"/>
<rect x="125" y="130" width="120" height="40" class="box-blau"/>
<text x="185" y="156" class="mitte geheim">Schlüssel 1</text>
<text x="185" y="190" class="mitte klein">für Nachricht 1,</text>
<text x="185" y="208" class="mitte klein">danach gelöscht</text>
<line x1="360" y1="60" x2="403" y2="60" class="pfeil"/>
<rect x="405" y="42" width="60" height="36" class="box"/>
<text x="435" y="66" class="mitte fett">KDF</text>
<line x1="465" y1="60" x2="508" y2="60" class="pfeil"/>
<line x1="435" y1="78" x2="435" y2="128" class="pfeil"/>
<rect x="375" y="130" width="120" height="40" class="box-blau"/>
<text x="435" y="156" class="mitte geheim">Schlüssel 2</text>
<text x="435" y="190" class="mitte klein">für Nachricht 2,</text>
<text x="435" y="208" class="mitte klein">danach gelöscht</text>
<line x1="610" y1="60" x2="636" y2="60" class="pfeil-gestrichelt"/>
<line x1="560" y1="245" x2="64" y2="245" class="pfeil-gestrichelt"/>
<text x="312" y="237" class="mitte klein">✗ zurückdrehen unmöglich → alte Nachrichten bleiben geheim</text>
</svg>
