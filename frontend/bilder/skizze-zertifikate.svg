<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 305" width="640" height="305">
<style>
    text { font-family: system-ui, sans-serif; font-size: 17px; fill: #000; }
    .fett { font-weight: bold; }
    .mitte { text-anchor: middle; }
    .klein { font-size: 14px; fill: #555; }
    .mono { font-family: monospace; font-size: 15px; }
    .geheim { fill: #3d5afe; font-weight: bold; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .box-blau { fill: #fff; stroke: #3d5afe; stroke-width: 3; }
    .box-grau { fill: #fff; stroke: #000; stroke-width: 2; stroke-dasharray: 6 4; }
    .linie { stroke: #000; stroke-width: 2; fill: none; }
    .pfeil { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#pfeil); }
    .pfeil-blau { stroke: #3d5afe; stroke-width: 2; fill: none; marker-end: url(#pfeil-blau); }
    .gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .pfeil-gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#pfeil); }
</style>
<defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
    <marker id="pfeil-blau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#3d5afe"/>
    </marker>
</defs>
<rect x="40" y="20" width="260" height="60" class="box-blau"/>
<text x="170" y="46" class="mitte fett">Root-CA</text>
<text x="170" y="68" class="mitte klein">signiert sich selbst</text>
<rect x="40" y="125" width="260" height="60" class="box"/>
<text x="170" y="151" class="mitte fett">Zwischen-CA</text>
<text x="170" y="173" class="mitte klein">signiert von Root-CA</text>
<rect x="40" y="230" width="260" height="60" class="box"/>
<text x="170" y="256" class="mitte fett">www.example.org</text>
<text x="170" y="278" class="mitte klein">signiert von Zwischen-CA</text>
<line x1="170" y1="80" x2="170" y2="123" class="pfeil"/>
<text x="182" y="107" class="klein">signiert</text>
<line x1="170" y1="185" x2="170" y2="228" class="pfeil"/>
<text x="182" y="212" class="klein">signiert</text>
<rect x="400" y="20" width="220" height="60" class="box"/>
<text x="510" y="46" class="mitte fett">Browser</text>
<text x="510" y="68" class="mitte klein">Root-CA ist eingebaut</text>
<line x1="398" y1="50" x2="303" y2="50" class="pfeil-blau"/>
<text x="350" y="42" class="mitte geheim">vertraut</text>
<text x="400" y="125" class="fett">prüft die Kette von unten:</text>
<text x="400" y="155">✓ jede Signatur stimmt</text>
<text x="400" y="183">✓ Name passt zur Domain</text>
<text x="400" y="211">✓ gültig, nicht gesperrt</text>
<line x1="395" y1="260" x2="303" y2="260" class="pfeil"/>
<text x="400" y="265" class="klein">Server schickt sein</text>
<text x="400" y="283" class="klein">Zertifikat + Zwischen-CA</text>
</svg>
