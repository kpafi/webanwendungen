<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430">
<style>
    text { font-family: system-ui, sans-serif; font-size: 17px; fill: #000; }
    .fett { font-weight: bold; }
    .mitte { text-anchor: middle; }
    .klein { font-size: 14px; fill: #555; }
    .mono { font-family: monospace; font-size: 15px; }
    .geheim { fill: #3d5afe; font-weight: bold; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .box-blau { fill: #fff; stroke: #3d5afe; stroke-width: 3; }
    .box-grau { fill: #fff; stroke: #000; stroke-width: 2; stroke-dasharray: 6 4; }
    .linie { stroke: #000; stroke-width: 2; fill: none; }
    .pfeil { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#pfeil); }
    .pfeil-blau { stroke: #3d5afe; stroke-width: 2; fill: none; marker-end: url(#pfeil-blau); }
    .gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .pfeil-gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#pfeil); }
</style>
<defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
    <marker id="pfeil-blau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#3d5afe"/>
    </marker>
</defs>
<text x="320" y="24" class="mitte fett">öffentlich: q = 17, Matrix A und Vektor b</text>
<rect x="10" y="40" width="300" height="200" class="box"/>
<text x="160" y="66" class="mitte fett">Alice: b = A · s + e</text>
<text x="160" y="100" class="mitte mono">2·<tspan class="geheim">3</tspan> + 7·<tspan class="geheim">5</tspan> <tspan class="geheim">+ 1</tspan> ≡ 8</text>
<text x="160" y="130" class="mitte mono">9·<tspan class="geheim">3</tspan> + 4·<tspan class="geheim">5</tspan> <tspan class="geheim">− 1</tspan> ≡ 12</text>
<text x="160" y="160" class="mitte mono">5·<tspan class="geheim">3</tspan> + 11·<tspan class="geheim">5</tspan> <tspan class="geheim">+ 0</tspan> ≡ 2</text>
<text x="160" y="190" class="mitte mono">13·<tspan class="geheim">3</tspan> + 3·<tspan class="geheim">5</tspan> <tspan class="geheim">+ 1</tspan> ≡ 4</text>
<text x="160" y="225" class="mitte klein">blau = geheim: s = (3, 5) und Fehler e</text>
<rect x="330" y="40" width="300" height="200" class="box"/>
<text x="480" y="66" class="mitte fett">Bob verschlüsselt Bit 1</text>
<text x="480" y="100" class="mitte">wählt zufällig Zeilen 1, 3, 4</text>
<text x="480" y="130" class="mitte">u = A-Zeilen addiert = (3, 4)</text>
<text x="480" y="160" class="mitte">v = 8 + 2 + 4 <tspan class="fett">+ 8</tspan> ≡ 5</text>
<text x="480" y="190" class="mitte klein">+ 8 = halbes q, weil Bit 1</text>
<text x="480" y="225" class="mitte klein">geschickt wird nur (u, v)</text>
<line x1="480" y1="240" x2="480" y2="268" class="pfeil"/>
<rect x="10" y="270" width="620" height="150" class="box-blau"/>
<text x="320" y="298" class="mitte">Alice: v − u · s = 5 − (3·<tspan class="geheim">3</tspan> + 4·<tspan class="geheim">5</tspan>) ≡ 10</text>
<rect x="206" y="336" width="260" height="28" fill="#eef1ff" stroke="#3d5afe" stroke-width="2"/>
<line x1="60" y1="350" x2="580" y2="350" class="linie"/>
<g class="linie">
    <line x1="60" y1="344" x2="60" y2="356"/><line x1="92.5" y1="346" x2="92.5" y2="354"/><line x1="125" y1="346" x2="125" y2="354"/>
    <line x1="157.5" y1="346" x2="157.5" y2="354"/><line x1="190" y1="346" x2="190" y2="354"/><line x1="222.5" y1="346" x2="222.5" y2="354"/>
    <line x1="255" y1="346" x2="255" y2="354"/><line x1="287.5" y1="346" x2="287.5" y2="354"/><line x1="320" y1="344" x2="320" y2="356"/>
    <line x1="352.5" y1="346" x2="352.5" y2="354"/><line x1="385" y1="346" x2="385" y2="354"/><line x1="417.5" y1="346" x2="417.5" y2="354"/>
    <line x1="450" y1="346" x2="450" y2="354"/><line x1="482.5" y1="346" x2="482.5" y2="354"/><line x1="515" y1="346" x2="515" y2="354"/>
    <line x1="547.5" y1="346" x2="547.5" y2="354"/><line x1="580" y1="344" x2="580" y2="356"/>
</g>
<text x="125" y="328" class="mitte klein">nahe 0 → Bit 0</text>
<text x="336" y="328" class="mitte geheim">nahe 8 → Bit 1</text>
<text x="531" y="328" class="mitte klein">→ Bit 0</text>
<circle cx="385" cy="350" r="7" fill="#3d5afe"/>
<text x="60" y="380" class="mitte klein">0</text>
<text x="320" y="380" class="mitte klein">8</text>
<text x="385" y="380" class="mitte geheim">10</text>
<text x="580" y="380" class="mitte klein">16</text>
<text x="320" y="408" class="mitte klein">Abstand 10 − 8 = 2 ist nur das Rauschen der kleinen Fehler</text>
</svg>
