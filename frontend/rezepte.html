<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krypto-Küche – Alle Rezepte</title>
    <link rel="stylesheet" href="css/global-style.css">
    <link rel="stylesheet" href="css/rezepte-style.css">
    <script src="js/darkmode.js"></script>
</head>
<body>

    <header class="site-header">
       
        <a href="index.html" class="logo">
            <img src="bilder/krypto-kueche-logo-128.png" alt="Krypto-Küche Logo" height="48" width="48">
            Krypto-Küche
        </a>
        <nav>
            <ul>
                <li><a href="rezepte.html">Rezepte</a></li>
                <li><a href="rezepte.html?schutzziel=a">Authentizität</a></li>
                <li><a href="rezepte.html?schutzziel=v">Vertraulichkeit</a></li>
                <li><a href="rezepte.html?schutzziel=i">Integrität</a></li>
            </ul>
        </nav>

        <details class="suche">
            <summary aria-label="Suche öffnen">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="7"/>
                    <line x1="16" y1="16" x2="21" y2="21"/>
                </svg>
            </summary>
            <form role="search" action="rezepte.html">
                <input type="search" name="q" placeholder="Rezept suchen …" aria-label="Rezepte durchsuchen">
                <button type="submit">Suchen</button>
            </form>
        </details>
        <button id="darkmode" class="darkmode-btn" aria-label="Darkmode umschalten">&#9680;</button>
    </header>

    <main>
        <p class="rezept-anzahl" id="rezept-anzahl"></p>
        <section class="hero">   <!-- die section wid von dem css teil hero gemanaged(also nur die überschrift, hab die von der index geklaut, und minimal angepasst, so dass alles einheitlich wirkt ) -->
            <h1 id="ueberschrift">Alle Rezepte</h1>
        </section>

        <!-- der kleine filter, die kaestchen fuer die schutzziele baut js/kachelbutton.js aus der datenbank -->
        <form class="filterklein">
            <div class="kachel-rasterklein" id="filter-raster">
                <p class="hochladen-hinweis" id="filter-hinweis">Hier kannst du nochmal deinen Filter anpassen.</p>
            </div>
        </form>

        <div class="filter">
            <p id="meldung"></p>

            <!-- hier kommen die rezept-kacheln rein, auch die baut js/kachelbutton.js aus der datenbank -->
            <div class="kachel-raster" id="kacheln"></div>

            <div class="kachel-raster hochladen-bereich">
                <p class="hochladen-hinweis">Rezept nicht gefunden?</p>
                <a href="rezept_hochladen.html" class="kachelklein hochladen">
                    <span class="kachel-titelklein">Hochladen</span>
                </a>
                <p class="hochladen-hinweis">Hier kannst du dein eigenes Rezept hochladen.</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Krypto-Küche – WBA WS 26/27</p>
        <a href="impressum.html">Impressum</a>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/kachelbutton.js"></script>
</body>
</html>
