<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krypto-Küche – Startseite</title>
    <link rel="stylesheet" href="css/global-style.css">
    <link rel="stylesheet" href="css/index-style.css">
</head>
<body>

    <header class="site-header">
       
        <a href="index.html" class="logo">
            <img src="bilder/krypto-kueche-logo-128.png" alt="Krypto-Küche Logo" height="48" width="48">
            Krypto-Küche
        </a>
        <nav>
            <ul>
                <li><a href="rezepte.html">Rezepte</a></li>
                <li><a href="a.html">Authentizität</a></li>
                <li><a href="v.html">Vertraulichkeit</a></li>
                <li><a href="i.html">Integrität</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Sicherheit nach Rezept.</h1>
            <p>Wähle aus, was du schützen willst – wir zeigen dir die passenden Rezepte.</p>
        </section>
    
        <form action="rezepte.html" method="get" class="filter">
            <div class="kachel-raster">
    
                <label class="kachel">
                    <input type="checkbox" name="schutzziel" value="authentizitaet">
                    <span class="kachel-titel">Authentizität</span>
                    <span class="kachel-text">Die Nachricht stammt wirklich von dem, der behauptet, sie geschickt zu haben.</span>
                </label>
    
                <label class="kachel">
                    <input type="checkbox" name="schutzziel" value="vertraulichkeit">
                    <span class="kachel-titel">Vertraulichkeit</span>
                    <span class="kachel-text">Nur Berechtigte können die Daten lesen.</span>
                </label>
    
                <label class="kachel">
                    <input type="checkbox" name="schutzziel" value="integritaet">
                    <span class="kachel-titel">Integrität</span>
                    <span class="kachel-text">Die Daten wurden nicht unbemerkt verändert.</span>
                </label>
    
            </div>
    
            <button type="submit" class="anzeigen-button">Anzeigen</button>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Krypto-Küche – WBA WS 26/27</p>
        <a href="impressum.html">Impressum</a>
    </footer>

</body>
</html>
