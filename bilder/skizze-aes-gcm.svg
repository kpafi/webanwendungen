<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 305" width="640" height="305">
<style>
    text { font-family: system-ui, sans-serif; font-size: 17px; fill: #000; }
    .fett { font-weight: bold; }
    .mitte { text-anchor: middle; }
    .klein { font-size: 14px; fill: #555; }
    .mono { font-family: monospace; font-size: 15px; }
    .geheim { fill: #3d5afe; font-weight: bold; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .box-blau { fill: #fff; stroke: #3d5afe; stroke-width: 3; }
    .box-grau { fill: #fff; stroke: #000; stroke-width: 2; stroke-dasharray: 6 4; }
    .linie { stroke: #000; stroke-width: 2; fill: none; }
    .pfeil { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#pfeil); }
    .pfeil-blau { stroke: #3d5afe; stroke-width: 2; fill: none; marker-end: url(#pfeil-blau); }
    .gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .pfeil-gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#pfeil); }
</style>
<defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
    <marker id="pfeil-blau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#3d5afe"/>
    </marker>
</defs>
<rect x="10" y="30" width="160" height="40" class="box"/>
<text x="90" y="56" class="mitte">Nonce ‖ Zähler</text>
<line x1="170" y1="50" x2="208" y2="50" class="pfeil"/>
<rect x="210" y="30" width="80" height="40" class="box"/>
<text x="250" y="56" class="mitte fett">AES</text>
<text x="250" y="104" class="geheim mitte">K</text>
<line x1="250" y1="88" x2="250" y2="72" class="pfeil-blau"/>
<line x1="290" y1="50" x2="344" y2="50" class="pfeil"/>
<circle cx="360" cy="50" r="14" class="box"/>
<line x1="346" y1="50" x2="374" y2="50" class="linie"/>
<line x1="360" y1="36" x2="360" y2="64" class="linie"/>
<rect x="300" y="100" width="120" height="40" class="box"/>
<text x="360" y="126" class="mitte">Klartext</text>
<line x1="360" y1="100" x2="360" y2="66" class="pfeil"/>
<line x1="374" y1="50" x2="428" y2="50" class="pfeil"/>
<rect x="430" y="30" width="130" height="40" class="box"/>
<text x="495" y="56" class="mitte">Geheimtext</text>
<text x="170" y="158" class="klein">1. verschlüsseln (Vertraulichkeit)</text>
<line x1="495" y1="70" x2="495" y2="168" class="pfeil"/>
<rect x="440" y="170" width="110" height="40" class="box"/>
<text x="495" y="196" class="mitte fett">GHASH</text>
<text x="410" y="196" class="geheim mitte">K</text>
<line x1="420" y1="190" x2="438" y2="190" class="pfeil-blau"/>
<line x1="495" y1="210" x2="495" y2="248" class="pfeil"/>
<rect x="440" y="250" width="110" height="40" class="box-blau"/>
<text x="495" y="276" class="mitte fett">Tag</text>
<text x="560" y="196" class="klein">2. versiegeln</text>
<rect x="10" y="190" width="370" height="100" class="box-grau"/>
<text x="25" y="216" class="fett">Empfänger:</text>
<text x="25" y="244">1. Tag selbst berechnen und vergleichen</text>
<text x="25" y="272">2. nur wenn gleich: entschlüsseln</text>
</svg>
