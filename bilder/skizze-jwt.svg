<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 395" width="640" height="395">
<style>
    text { font-family: system-ui, sans-serif; font-size: 17px; fill: #000; }
    .fett { font-weight: bold; }
    .mitte { text-anchor: middle; }
    .klein { font-size: 14px; fill: #555; }
    .mono { font-family: monospace; font-size: 15px; }
    .geheim { fill: #3d5afe; font-weight: bold; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .box-blau { fill: #fff; stroke: #3d5afe; stroke-width: 3; }
    .box-grau { fill: #fff; stroke: #000; stroke-width: 2; stroke-dasharray: 6 4; }
    .linie { stroke: #000; stroke-width: 2; fill: none; }
    .pfeil { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#pfeil); }
    .pfeil-blau { stroke: #3d5afe; stroke-width: 2; fill: none; marker-end: url(#pfeil-blau); }
    .gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .pfeil-gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#pfeil); }
</style>
<defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
    <marker id="pfeil-blau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#3d5afe"/>
    </marker>
</defs>
<rect x="10" y="30" width="190" height="40" class="box"/>
<text x="105" y="56" class="mitte mono">eyJhbGciOi…</text>
<text x="105" y="94" class="mitte fett">Header</text>
<text x="105" y="115" class="mitte klein">{"alg":"HS256"}</text>
<rect x="215" y="30" width="190" height="40" class="box"/>
<text x="310" y="56" class="mitte mono">eyJzdWIiOi…</text>
<text x="310" y="94" class="mitte fett">Payload</text>
<text x="310" y="115" class="mitte klein">{"sub":"alice"}</text>
<rect x="420" y="30" width="210" height="40" class="box-blau"/>
<text x="525" y="56" class="mitte mono">SflKxwRJSM…</text>
<text x="525" y="94" class="mitte fett">Signatur</text>
<text x="525" y="115" class="mitte klein">HMAC(K, Header.Payload)</text>
<text x="207" y="58" class="mitte fett">.</text>
<text x="412" y="58" class="mitte fett">.</text>
<text x="10" y="20" class="klein">Ein Token = drei Teile, durch Punkte getrennt:</text>
<text x="320" y="145" class="mitte klein">Header und Payload sind nur kodiert – jeder kann sie lesen!</text>
<rect x="30" y="170" width="140" height="40" class="box"/>
<text x="100" y="196" class="mitte fett">Browser</text>
<rect x="470" y="170" width="140" height="40" class="box"/>
<text x="540" y="196" class="mitte fett">Server</text>
<text x="540" y="230" class="geheim mitte">kennt K</text>
<line x1="100" y1="210" x2="100" y2="375" class="gestrichelt"/>
<line x1="540" y1="240" x2="540" y2="375" class="gestrichelt"/>
<line x1="100" y1="265" x2="536" y2="265" class="pfeil"/>
<text x="320" y="255" class="mitte">1. Login mit Passwort</text>
<line x1="540" y1="310" x2="104" y2="310" class="pfeil"/>
<text x="320" y="300" class="mitte">2. Token</text>
<line x1="100" y1="355" x2="536" y2="355" class="pfeil"/>
<text x="320" y="345" class="mitte">3. jede Anfrage + Token</text>
<text x="530" y="385" class="klein" text-anchor="end">4. Signatur nachrechnen ✓</text>
</svg>
