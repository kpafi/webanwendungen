<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290">
<style>
    text { font-family: system-ui, sans-serif; font-size: 17px; fill: #000; }
    .fett { font-weight: bold; }
    .mitte { text-anchor: middle; }
    .klein { font-size: 14px; fill: #555; }
    .mono { font-family: monospace; font-size: 15px; }
    .geheim { fill: #3d5afe; font-weight: bold; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .box-blau { fill: #fff; stroke: #3d5afe; stroke-width: 3; }
    .box-grau { fill: #fff; stroke: #000; stroke-width: 2; stroke-dasharray: 6 4; }
    .linie { stroke: #000; stroke-width: 2; fill: none; }
    .pfeil { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#pfeil); }
    .pfeil-blau { stroke: #3d5afe; stroke-width: 2; fill: none; marker-end: url(#pfeil-blau); }
    .gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .pfeil-gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#pfeil); }
</style>
<defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
    <marker id="pfeil-blau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#3d5afe"/>
    </marker>
</defs>
<rect x="10" y="30" width="120" height="40" class="box"/>
<text x="70" y="56" class="mitte">E-Mail</text>
<line x1="130" y1="50" x2="178" y2="50" class="pfeil"/>
<rect x="180" y="30" width="80" height="40" class="box"/>
<text x="220" y="56" class="mitte fett">AES</text>
<line x1="260" y1="50" x2="308" y2="50" class="pfeil"/>
<rect x="310" y="30" width="180" height="40" class="box"/>
<text x="400" y="56" class="mitte">Mail (verschlüsselt)</text>
<rect x="10" y="150" width="140" height="40" class="box-blau"/>
<text x="80" y="176" class="mitte geheim">Schlüssel S</text>
<text x="10" y="212" class="klein">zufällig, nur für diese Mail</text>
<polyline points="80,150 80,110 220,110 220,72" class="pfeil-blau"/>
<line x1="150" y1="170" x2="178" y2="170" class="pfeil"/>
<rect x="180" y="150" width="80" height="40" class="box"/>
<text x="220" y="176" class="mitte fett">RSA</text>
<text x="220" y="236" class="mitte klein">mit Bobs öffentlichem Schlüssel</text>
<line x1="220" y1="220" x2="220" y2="192" class="pfeil"/>
<line x1="260" y1="170" x2="308" y2="170" class="pfeil"/>
<rect x="310" y="150" width="180" height="40" class="box"/>
<text x="400" y="176" class="mitte">S (verschlüsselt)</text>
<rect x="530" y="30" width="100" height="160" class="box"/>
<text x="580" y="60" class="mitte fett">an Bob</text>
<text x="580" y="95" class="mitte">Mail</text>
<text x="580" y="120" class="mitte">+</text>
<text x="580" y="145" class="mitte">S</text>
<text x="580" y="175" class="mitte klein">verschlüsselt</text>
<line x1="490" y1="50" x2="528" y2="50" class="pfeil"/>
<line x1="490" y1="170" x2="528" y2="170" class="pfeil"/>
<text x="10" y="275" class="klein">Bob entschlüsselt zuerst S mit seinem privaten Schlüssel – und mit S dann die Mail.</text>
</svg>
