<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" width="640" height="392">
<style>
    text { font-family: system-ui, sans-serif; font-size: 17px; fill: #000; }
    .fett { font-weight: bold; }
    .mitte { text-anchor: middle; }
    .klein { font-size: 14px; fill: #555; }
    .mono { font-family: monospace; font-size: 15px; }
    .geheim { fill: #3d5afe; font-weight: bold; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .box-blau { fill: #fff; stroke: #3d5afe; stroke-width: 3; }
    .box-grau { fill: #fff; stroke: #000; stroke-width: 2; stroke-dasharray: 6 4; }
    .linie { stroke: #000; stroke-width: 2; fill: none; }
    .pfeil { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#pfeil); }
    .pfeil-blau { stroke: #3d5afe; stroke-width: 2; fill: none; marker-end: url(#pfeil-blau); }
    .gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .pfeil-gestrichelt { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#pfeil); }
</style>
<defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
    <marker id="pfeil-blau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#3d5afe"/>
    </marker>
</defs>
<text x="320" y="24" class="mitte fett">öffentlich: p = 23, g = 5</text>
<rect x="30" y="45" width="140" height="40" class="box"/>
<text x="100" y="71" class="mitte fett">Alice</text>
<rect x="470" y="45" width="140" height="40" class="box"/>
<text x="540" y="71" class="mitte fett">Bob</text>
<line x1="100" y1="124" x2="100" y2="262" class="gestrichelt"/>
<line x1="540" y1="124" x2="540" y2="262" class="gestrichelt"/>
<text x="100" y="112" class="geheim mitte">geheim: a = 6</text>
<text x="540" y="112" class="geheim mitte">geheim: b = 15</text>
<line x1="100" y1="160" x2="536" y2="160" class="pfeil"/>
<text x="320" y="150" class="mitte">A = 5⁶ mod 23 = 8</text>
<line x1="540" y1="215" x2="104" y2="215" class="pfeil"/>
<text x="320" y="205" class="mitte">B = 5¹⁵ mod 23 = 19</text>
<rect x="10" y="262" width="180" height="40" class="box-blau"/>
<text x="100" y="288" class="mitte">s = 19⁶ mod 23 = 2</text>
<rect x="450" y="262" width="180" height="40" class="box-blau"/>
<text x="540" y="288" class="mitte">s = 8¹⁵ mod 23 = 2</text>
<rect x="205" y="320" width="230" height="62" class="box-grau"/>
<text x="320" y="345" class="mitte">Eve hört mit: p, g, A, B</text>
<text x="320" y="368" class="mitte klein">kennt aber nicht a, b und s</text>
</svg>
