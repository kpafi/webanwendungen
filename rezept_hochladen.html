<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krypto-Küche – Rezept hochladen</title>
    <link rel="stylesheet" href="css/global-style.css">
    <link rel="stylesheet" href="css/rezepte-style.css">
    <link rel="stylesheet" href="css/beispielrezept-style.css">
    <link rel="stylesheet" href="css/rezept_hochladen-style.css">
    <script src="js/darkmode.js"></script>
</head>
<body>

    <header class="site-header">
       
        <a href="index.html" class="logo">
            <img src="bilder/krypto-kueche-logo-128.png" alt="Krypto-Küche Logo" height="48" width="48">
            Krypto-Küche
        </a>
        <nav>
            <ul>
                <li><a href="rezepte.html">Rezepte</a></li>
                <li><a href="a.html">Authentizität</a></li>
                <li><a href="v.html">Vertraulichkeit</a></li>
                <li><a href="i.html">Integrität</a></li>
            </ul>
        </nav>

        <details class="suche">
            <summary aria-label="Suche öffnen">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="7"/>
                    <line x1="16" y1="16" x2="21" y2="21"/>
                </svg>
            </summary>
            <form role="search" action="rezepte.html">
                <input type="search" name="q" placeholder="Rezept suchen …" aria-label="Rezepte durchsuchen">
                <button type="submit">Suchen</button>
            </form>
        </details>
        <button id="darkmode" class="darkmode-btn" aria-label="Darkmode umschalten">&#9680;</button>
    </header>

    <main>
    <section class="hero">
        <h1>Eigenes Rezept schreiben</h1>
        <p>Einfach die Kästen ausfüllen.</p>
    </section>

        <form class="rezept-seite">     <!-- der code ist aus den einzelnen rezeptseiten geklaut ich hab jetzt keine lust die gnazen nahmen abzuändern, deshalb heisst das hier alles so seltsam -->

            <div class="rezept-box">
                <h2>Name</h2>
                <label>Name des Rezepts
                    <input type="text" required>
                </label>
                <label>Ein Satz, der Lust auf das Rezept macht
                    <input type="text" required>
                </label>
                <p>Schutzziele:</p>
                <label class="ziel-wahl"><input type="checkbox" name="ziel" value="a"> Authentizität</label>
                <label class="ziel-wahl"><input type="checkbox" name="ziel" value="v"> Vertraulichkeit</label>
                <label class="ziel-wahl"><input type="checkbox" name="ziel" value="i"> Integrität</label>
            </div>

            <div class="rezept-box">
                <h2>Definition</h2>
                <textarea rows="4" required placeholder="Was ist das Verfahren und wofür braucht man es?"></textarea>
            </div>

            <div class="rezept-reihe">

                <div class="rezept-box zutaten">
                    <h2>Zutaten</h2>
                    <textarea rows="6" required placeholder="Pro Zeile eine Zutat"></textarea>
                </div>

                <div class="rezept-box zubereitung">
                    <h2>Zubereitung</h2>
                    <textarea rows="6" required placeholder="Pro Zeile ein Schritt"></textarea>
                </div>

            </div>

            <div class="rezept-box">
                <h2>Skizze</h2>
                <label>Bild auswählen (freiwillig)
                    <input type="file" id="skizze" accept="image/*">
                </label>
                <img id="vorschau" class="skizze" alt="Vorschau der Skizze">
            </div>

            <div class="rezept-box">
                <h2>Tipps</h2>
                <textarea rows="4" required placeholder="Pro Zeile ein Tipp"></textarea>
            </div>

            <!-- der button macht noch nichts, das kommt spaeter mit dem server -->
            <p class="hinzufuegen"><button type="button">Rezept hinzufügen</button></p>

        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Krypto-Küche – WBA WS 26/27</p>
        <a href="impressum.html">Impressum</a>
    </footer>

    <script src="js/rezept-schreiben.js"></script>
</body>
</html>
